<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso restrito — {{ arena.arena_name }}</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;font-family:'Barlow',system-ui,sans-serif}
    body{background:#FBFAF8;color:#181A1F;min-height:100vh;display:grid;place-items:center;padding:24px}
    .box{text-align:center;max-width:420px}
    .box i.big{font-size:38px;color:#B9BCC2}
    h1{font-size:24px;font-weight:700;margin-top:16px}
    p{color:#8E9198;margin-top:8px}
    a{display:inline-flex;align-items:center;gap:7px;margin-top:22px;background:#181A1F;color:#fff;
      text-decoration:none;font-weight:600;padding:11px 18px;border-radius:10px;font-size:14px}
  </style>
</head>
<body>
  <div class="box">
    <i class="fa-solid fa-lock big"></i>
    <h1>Acesso restrito</h1>
    <p>As Configurações só estão disponíveis para o administrador.</p>
    <a href="/"><i class="fa-solid fa-arrow-left"></i> Voltar ao Hub</a>
  </div>
</body>
</html>
