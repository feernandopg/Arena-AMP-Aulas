<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='logo.ico') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — {{ arena.arena_name }}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#FBFAF8;--navy:#132539;--navy2:#1B3350;--ink:#181A1F;--muted:#8E9198;--faint:#B9BCC2;
              --line:#ECEAE6;--accent:{{ arena.accent }};--danger:#D64545}
        *{box-sizing:border-box;margin:0;font-family:'Barlow',system-ui,sans-serif}
        body{background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink)}
        .stage{width:100%;max-width:390px}
        .card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
              box-shadow:0 24px 60px -28px rgba(19,37,57,.35)}
        /* topo navy com filete laranja (assinatura QUADRA) */
        .head{background:var(--navy);padding:26px 28px 22px;position:relative}
        .head::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
              background:linear-gradient(90deg,var(--accent) 0 64px,transparent 64px)}
        .brand{display:flex;align-items:center;gap:14px}
        .tile{width:52px;height:52px;border-radius:13px;background:var(--accent);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
        .tile img{width:38px;height:38px;object-fit:contain}
        .brand .nm{color:#fff;font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
        .brand .sub{color:#8FA3B8;font-size:12.5px;font-weight:500;margin-top:3px}
        /* corpo */
        .body{padding:26px 28px 28px}
        label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
        .field{margin-bottom:15px}
        .inp{position:relative}
        .inp i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px}
        .inp input{width:100%;padding:12px 13px 12px 36px;border:1px solid var(--line);border-radius:10px;
              font-size:14.5px;font-family:'Barlow';color:var(--ink);outline:none;transition:.15s;background:#fff}
        .inp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent)}
        button{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:11px;
              font-family:'Barlow';font-weight:700;font-size:15px;cursor:pointer;transition:.15s;
              display:flex;align-items:center;justify-content:center;gap:9px;margin-top:4px}
        button:hover{filter:brightness(.94)}
        .error{display:flex;align-items:center;gap:9px;color:var(--danger);background:#FBEDED;border:1px solid #F0D6D6;
              padding:10px 13px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:15px}
        .remember{display:flex;align-items:center;gap:9px;margin:-2px 0 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
        .remember input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0;flex-shrink:0}
        .remember span{user-select:none}
        .foot{margin-top:20px;text-align:center;font-size:11.5px;color:var(--faint);font-weight:500}
        .modulos{display:flex;justify-content:center;gap:16px;margin-top:22px;color:var(--faint);font-size:12px;font-weight:600}
        .modulos span{display:inline-flex;align-items:center;gap:6px}
        .modulos i{font-size:11px;color:var(--muted)}
    </style>
</head>
<body>
    <div class="stage">
        <div class="card">
            <div class="head">
                <div class="brand">
                    <span class="tile"><img src="{% if arena.logo %}{{ url_for('uploaded_file', filename=arena.logo) }}{% else %}{{ url_for('static', filename='logo.png') }}{% endif %}" alt=""></span>
                    <div>
                        <div class="nm">{{ arena.arena_name }}</div>
                        <div class="sub">Acesso ao ecossistema</div>
                    </div>
                </div>
            </div>
            <div class="body">
                {% if error %}
                    <div class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
                {% endif %}
                <form method="POST">
                    <div class="field">
                        <label>Usuário</label>
                        <div class="inp"><i class="fa-regular fa-user"></i>
                        <input type="text" name="username" placeholder="Seu usuário" autocomplete="username" required value="{{ remember_username|default('', true) }}" {% if not remember_username %}autofocus{% endif %}></div>
                    </div>
                    <div class="field">
                        <label>Senha</label>
                        <div class="inp"><i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" placeholder="Sua senha" autocomplete="current-password" required {% if remember_username %}autofocus{% endif %}></div>
                    </div>
                    <label class="remember">
                        <input type="checkbox" name="remember" value="1" {% if remember_default|default(false, true) %}checked{% endif %}>
                        <span>Manter conectado neste computador</span>
                    </label>
                    <button type="submit">Entrar <i class="fa-solid fa-arrow-right"></i></button>
                </form>
                <div class="foot">Um login, todos os módulos.</div>
            </div>
        </div>
        <div class="modulos">
            <span><i class="fa-solid fa-users"></i> Aulas</span>
            <span><i class="fa-solid fa-receipt"></i> Comandas</span>
            <span><i class="fa-solid fa-trophy"></i> Ranking</span>
            <span><i class="fa-solid fa-chart-line"></i> Relatórios</span>
        </div>
    </div>
</body>
</html>
