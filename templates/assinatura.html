<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura — {{ arena.arena_name }}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='logo.ico') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#FBFAF8;--card:#FFFFFF;--navy:#132539;--ink:#181A1F;--muted:#8E9198;--faint:#B9BCC2;--line:#ECEAE6;
          --accent:{{ arena.accent }};--gold:#D9B45B;--gold2:#F0D488;--ok:#3B9A2B;--body:'Barlow',system-ui,sans-serif}
    *{box-sizing:border-box;margin:0;font-family:var(--body);-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--ink);min-height:100vh}
    .wrap{max-width:520px;margin:0 auto;padding:34px 26px 60px}
    .head{margin-bottom:20px}
    .head .eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase}
    .head h1{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:6px}
    .head p{color:var(--muted);font-size:14px;margin-top:4px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
    .plan-top{display:flex;align-items:center;gap:13px}
    .crown{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));
      display:grid;place-items:center;color:#3A2C05;font-size:19px;flex-shrink:0}
    .crown.gray{background:#EDEBE7;color:var(--faint)}
    .plan-nm{font-size:18px;font-weight:800;letter-spacing:-.3px}
    .status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-top:3px}
    .status .sdot{width:7px;height:7px;border-radius:50%}
    .st-ok{color:var(--ok)}.st-ok .sdot{background:var(--ok)}
    .st-warn{color:#B65A10}.st-warn .sdot{background:var(--accent)}
    .st-off{color:#B03A3A}.st-off .sdot{background:#B03A3A}
    .rows{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
    .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
    .row .l{color:var(--muted)}
    .row .v{color:var(--ink);font-weight:700}
    .sec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
    .pay{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:9px 0;border-top:1px solid #F3F1ED}
    .pay:first-of-type{border-top:none}
    .pay .pd{color:var(--ink);font-weight:600}
    .pay .pc{color:var(--muted)}
    .pay .ps{color:var(--ok);font-weight:700}
    .cta{margin-top:20px;width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
      background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3A2C05;font-weight:800;font-size:14.5px;font-family:var(--body);
      display:flex;align-items:center;justify-content:center;gap:9px}
    .cta.solid{background:var(--navy);color:#fff}
    .cta.cta-outline{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
    /* Cards de assinatura (Sistema e Site — dois vínculos distintos) */
    .asub{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
    .asub.sys{border-color:#D6DEE8;background:linear-gradient(180deg,#F7FAFD,#fff)}
    .asub-head{display:flex;align-items:center;gap:12px}
    .asub-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:#EDEBE7;color:var(--faint)}
    .asub-ic.sys{background:linear-gradient(135deg,var(--navy),#1B3350);color:#fff}
    .asub-ic.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3A2C05}
    .asub-nm{font-size:15px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
    .asub-tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#EEF1F4;padding:2px 7px;border-radius:20px}
    .asub-sub{font-size:12px;color:var(--muted);margin-top:1px}
    .align-note{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:11px 13px;
      border-radius:11px;background:linear-gradient(180deg,#F1F9EF,#F7FCF5);border:1px solid #CDE8C4}
    .align-note i{color:var(--ok);font-size:14px;margin-top:1px;flex-shrink:0}
    .align-note b{color:#2E7D22}
    .align-note .an-tx{font-size:12px;line-height:1.5;color:#3B5233}
    .asub-pr{text-align:right;font-size:16px;font-weight:800;color:var(--navy);white-space:nowrap}
    .asub-pr small{font-size:11px;font-weight:600;color:var(--muted)}
    .cta-site{margin-top:14px}
    .sub-rec{margin-top:16px;padding:14px 16px;border:1px solid #CDE8C4;background:#F1F9EF;border-radius:12px;font-size:13px;color:#2E7D22}
    .sub-rec-plan{font-size:11px;background:#DCF0D5;color:#2E7D22;border-radius:20px;padding:2px 9px;font-weight:700;margin-left:4px}
    .sub-rec-note{font-size:11.5px;color:#5B6675;margin-top:5px}
    .cta-cancel{margin-top:12px;color:#B03A3A;border-color:#E5C4C4}
    .cta-cancel:hover{background:#FCF0F0}
    .empty{text-align:center;color:var(--muted);font-size:13px;padding:6px 0 2px}
    .muted{color:var(--muted);font-size:12.5px;margin-top:14px;text-align:center}
    .load{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="eyebrow">Sua conta</div>
      <h1>Assinatura</h1>
      <p>Acompanhe seu plano, vencimento e pagamentos.</p>
    </div>
    <div class="card" id="card">
      <div class="load"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando…</div>
    </div>
  </div>

  <script>
    var PLAN = {{ plan|tojson }};
    var inShell = (window.self !== window.top);

    var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    function parseDate(s){
      if (!s) return null;
      var iso = String(s).replace(' UTC','').replace(' ','T');
      var d = new Date(iso);
      return isNaN(d.getTime()) ? null : d;
    }
    function fmtData(s){
      var d = parseDate(s);
      if (!d) return '—';
      return d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
    }
    function fmtReais(cents){
      if (cents == null) return '—';
      return 'R$ ' + (cents/100).toFixed(2).replace('.', ',');
    }
    function diasRestantes(s){
      var d = parseDate(s); if (!d) return null;
      return Math.ceil((d - new Date()) / 86400000);
    }
    function abrirPlanos(){
      if (inShell) window.parent.postMessage({ amp:'planos' }, '*');
      else window.location.href = '/';
    }
    function cancelarAssinatura(btn){
      if (!confirm('Cancelar a renovação automática? Seu acesso continua até o fim do período já pago; depois disso ele não renova sozinho.')) return;
      btn.disabled = true; btn.innerHTML = 'Cancelando…';
      fetch('/api/subscription/cancel', {method:'POST'}).then(function(r){ return r.json(); }).then(function(res){
        if (res && res.ok) { location.reload(); }
        else { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Cancelar renovação automática'; alert(res.error || 'Não foi possível cancelar. Tente de novo.'); }
      }).catch(function(){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Cancelar renovação automática'; alert('Falha de conexão.'); });
    }
    function siteCheckout(){
      // Checkout avulso do site (assinatura própria, R$20). Abre o Mercado Pago
      // e depois oferece "Já paguei, verificar" que recarrega ao ativar o site.
      var btn = document.querySelector('.cta-site');
      if (btn) { btn.disabled = true; btn.innerHTML = 'Abrindo pagamento…'; }
      fetch('/api/checkout', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({plan:'site'})})
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (res.checkout_url) {
            window.open(res.checkout_url, '_blank', 'noopener');
            if (btn){ btn.disabled=false; btn.className='cta cta-outline'; btn.innerHTML='<i class="fa-solid fa-rotate-right"></i> Já paguei, verificar'; btn.setAttribute('onclick','verificarSite(this)'); }
          } else if (btn) {
            btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-globe"></i> Contratar site';
            alert(res.error || 'Não foi possível iniciar o pagamento.');
          }
        })
        .catch(function(){ if(btn){ btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-globe"></i> Contratar site'; } });
    }
    function verificarSite(btn){
      btn.disabled=true; btn.innerHTML='Verificando…';
      fetch('/api/checkout/verify', {method:'POST'}).then(function(r){ return r.json(); }).then(function(){
        location.reload();
      }).catch(function(){ btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-rotate-right"></i> Já paguei, verificar'; });
    }

    function render(info){
      info = info || {};
      // Fonte da verdade = dado fresco do servidor (info); só cai pro cache
      // local (PLAN) se o servidor não respondeu.
      var temInfo = !!info.plan;
      var premium = temInfo ? (info.plan === 'premium') : PLAN.is_premium;
      var demo = temInfo ? (info.plan === 'demo') : PLAN.is_demo;
      var exp = info.expires_at || '';
      var dias = exp ? diasRestantes(exp) : null;
      var vencido = (exp && dias !== null && dias < 0);

      var crownCls = (premium || demo) ? '' : 'gray';
      var nome, stCls, stTxt;
      if (premium) {
        nome = info.ciclo ? ('Plano ' + info.ciclo) : 'Premium';
        if (vencido) { stCls='st-off'; stTxt='Vencido'; }
        else { stCls='st-ok'; stTxt = (dias!=null && dias<=7) ? ('Vence em ' + dias + ' dia(s)') : 'Ativo'; }
      } else if (demo) {
        nome = 'Período de teste';
        stCls='st-warn';
        var dd = (dias != null) ? dias : PLAN.demo_days_left;
        stTxt = (dd != null) ? (Math.max(0, dd) + ' dia(s) restante(s)') : 'Teste';
      } else {
        nome = 'Sem assinatura ativa';
        stCls='st-off'; stTxt='Inativo';
      }

      var h = '';
      h += '<div class="sec" style="margin-top:0">O que você tem</div>';

      // ── CARD 1: SISTEMA (Arena AMP) — a assinatura do ERP ──
      var sysRows = '';
      if (premium || demo) {
        if (info.desde) sysRows += '<div class="row"><span class="l">Assinante desde</span><span class="v">'+fmtData(info.desde)+'</span></div>';
        sysRows += '<div class="row"><span class="l">'+(demo?'Teste termina em':'Próximo vencimento')+'</span><span class="v">'
              + (exp ? fmtData(exp) : (premium ? 'Sem vencimento' : '—')) + '</span></div>';
        if (info.ciclo) sysRows += '<div class="row"><span class="l">Cobrança</span><span class="v">'+info.ciclo+'</span></div>';
      }
      h += '<div class="asub sys">'
        + '<div class="asub-head"><span class="asub-ic sys"><i class="fa-solid fa-desktop"></i></span>'
        + '<div style="flex:1"><div class="asub-nm">Sistema <span class="asub-tag">Arena AMP</span></div>'
        + '<div class="status '+stCls+'"><span class="sdot"></span>'+stTxt+'</div></div></div>';
      if (sysRows) h += '<div class="rows" style="margin-top:12px">'+sysRows+'</div>';
      if (info.sub_ativa) {
        // Assinatura recorrente ativa: mostra e permite cancelar.
        h += '<div class="sub-rec"><i class="fa-solid fa-repeat"></i> <b>Renovação automática ativa</b>'
          + ' <span class="sub-rec-plan">' + (info.sub_plan === 'trimestral' ? 'trimestral' : 'mensal') + '</span>'
          + '<div class="sub-rec-note">Cobrado automático no cartão. Você não precisa fazer nada.</div>'
          + '<button class="cta cta-outline cta-cancel" onclick="cancelarAssinatura(this)"><i class="fa-solid fa-xmark"></i> Cancelar renovação automática</button></div>';
      } else if (premium && !vencido) {
        h += '<button class="cta cta-site cta-outline" onclick="abrirPlanos()"><i class="fa-solid fa-arrows-rotate"></i> Renovar ou mudar de plano</button>';
      } else {
        h += '<button class="cta cta-site" onclick="abrirPlanos()"><i class="fa-solid fa-crown"></i> '
          + (vencido ? 'Renovar sistema' : (demo ? 'Assinar o sistema' : 'Assinar o sistema')) + '</button>';
      }
      h += '</div>';

      // ── CARD 2: SITE PROFISSIONAL — assinatura PRÓPRIA (vínculo separado) ──
      var siteAtivo = !!info.site_ativo;
      var siteExp = info.site_expires_at || '';
      var siteDesde = info.site_started_at || '';
      var sd = siteExp ? diasRestantes(siteExp) : null;
      var sCls, sTxt;
      if (siteAtivo) { sCls='st-ok'; sTxt = (sd!=null && sd>=0 && sd<=7) ? ('Vence em '+sd+' dia(s)') : 'Ativo'; }
      else if (info.has_site) { sCls='st-off'; sTxt='Vencido'; }
      else { sCls='st-warn'; sTxt='Não contratado'; }
      h += '<div class="asub">'
        + '<div class="asub-head"><span class="asub-ic '+(siteAtivo?'on':'')+'"><i class="fa-solid fa-globe"></i></span>'
        + '<div style="flex:1"><div class="asub-nm">Site profissional</div>'
        + '<div class="status '+sCls+'"><span class="sdot"></span>'+sTxt+'</div></div>'
        + '<div class="asub-pr">R$ 20<small>/mês</small></div></div>';
      var siteRows = '';
      if (siteDesde) siteRows += '<div class="row"><span class="l">Contratado em</span><span class="v">'+fmtData(siteDesde)+'</span></div>';
      if (siteExp) siteRows += '<div class="row"><span class="l">Próximo vencimento</span><span class="v">'+fmtData(siteExp)+'</span></div>';
      if (siteRows) h += '<div class="rows" style="margin-top:12px">'+siteRows+'</div>';
      // Aviso: quando o site foi alinhado ao vencimento do sistema, explicamos
      // pro cliente que agora renovam juntos (e que ele ganhou dias de cortesia).
      if (info.site_alinhado) {
        h += '<div class="align-note"><i class="fa-solid fa-circle-check"></i>'
          + '<div class="an-tx"><b>Site e sistema vencem no mesmo dia.</b> '
          + 'Ajustamos o vencimento do seu site pra bater com o do sistema — '
          + 'com alguns dias de cortesia — pra você <b>renovar tudo de uma vez, '
          + 'numa mensalidade só</b>. Nenhum dia que você pagou é perdido.</div></div>';
      }
      if (!info.has_site) {
        h += '<div class="asub-sub" style="margin-top:10px">Um site sob medida pra sua arena, com manutenção inclusa. É uma assinatura à parte do sistema.</div>';
        h += '<div class="asub-sub" style="margin-top:6px"><b>Domínio à parte:</b> o endereço do site (ex.: suaarena.com.br) é obrigatório, pago <b>1× por ano</b> direto no registrador (R$ 60–90/ano no .com.br). O nome desejado pode já estar em uso — a gente escolhe junto. Fica: R$ 20/mês (site) + o domínio 1×/ano.</div>';
      }
      // O site é uma assinatura PRÓPRIA, à parte do sistema — não exige ser
      // assinante do sistema (igual ao fluxo pelo módulo Site). Só limitamos a
      // RENOVAÇÃO antecipada a partir de 15 dias antes do vencimento.
      var podeRenovar = !siteAtivo || (sd != null && sd <= 15);
      if (podeRenovar) {
        h += '<button class="cta cta-site" onclick="siteCheckout()"><i class="fa-solid fa-globe"></i> '+(siteAtivo?'Renovar site':'Contratar site')+'</button>';
      } else {
        h += '<div class="muted" style="margin-top:14px">Renovação liberada a partir de 15 dias antes do vencimento.</div>';
      }
      h += '</div>';

      var pgs = info.pagamentos || [];
      if (pgs.length) {
        h += '<div class="sec">Últimos pagamentos</div>';
        pgs.slice(0,5).forEach(function(p){
          h += '<div class="pay"><span class="pd">'+fmtData(p.data)+'</span>'
            + '<span class="pc">'+(p.plano||'')+' · '+fmtReais(p.valor_cents)+'</span>'
            + '<span class="ps">Aprovado</span></div>';
        });
      }

      if (!premium && !demo) h += '<div class="empty" style="margin-top:12px">Assine o sistema para manter todos os módulos liberados.</div>';
      else h += '<div class="muted" style="margin-top:16px">Precisa de ajuda? Fale com o suporte pelo Hub.</div>';

      document.getElementById('card').innerHTML = h;
    }

    fetch('/api/assinatura').then(function(r){ return r.json(); })
      .then(function(info){ render(info.error ? {} : info); })
      .catch(function(){ render({}); });
  </script>
</body>
</html>
